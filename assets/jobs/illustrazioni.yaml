# illustrazioni: vedi GUIDA Blocco C §4. Rilancia con «pnpm assets generate assets/jobs/illustrazioni.yaml»: salta le immagini già fatte.
id: illustrazioni
workflow: flux-illustrazioni.json   # FLUX.1-dev: le illustrazioni piatte gli riescono meglio che a SDXL
output: illustrazioni
kind: illustrazione
variants: 3
seedBase: 4101
size: [1024, 1024]
styleSuffix: >-
  drawn as a flat vector poster illustration with bold geometric shapes and no outlines, on a dark obsidian navy background,
  limited palette of obsidian navy, emerald green, cyan and warm amber, generous negative space, centred composition,
  editorial sports magazine style, clean and readable even at small size, no text, no lettering, no numbers
negativePrompt: >-
  text, watermark, signature, logo, brand, jersey sponsor, blurry, jpeg artifacts, extra limbs, deformed hands, oversaturated, neon, cartoon 3d, faces
nodeBindings:
  positive: 6.inputs.text
  seed: 10.inputs.seed
  width: 5.inputs.width
  height: 5.inputs.height
process: { width: 512, height: 512, palette: 0.5, thumb: true }
# per la coerenza (Blocco C §2, W2): quando hai lo style-anchor, esporta il workflow con l'IP-Adapter, aggiungi
# «styleRef: <nodo>.inputs.image» ai nodeBindings e «styleRef: style-anchor.png» agli elementi (il file sta in assets/)
items:
