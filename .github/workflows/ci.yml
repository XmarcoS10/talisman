# Test e controllo dei tipi a ogni push e pull request (GUIDA, appendice A).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # le macchine di GitHub oscillano: lo stesso codice ha segnato fra 4,1 e 7,0 ms (30/09, 0.9.0-0.11.0), mentre in
      # locale restava fermo a 5,5. Il limite ferma i rallentamenti veri, non il rumore.
      - run: pnpm bench --max 8
